services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-with-openssl-rand-base64-32}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Optionnel : fournisseur IA côté serveur (sinon rapport local dans le navigateur)
      # NEXT_PUBLIC_DEMO_AI_SERVER: ${NEXT_PUBLIC_DEMO_AI_SERVER:-false}
      # AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - '3000:3000'
